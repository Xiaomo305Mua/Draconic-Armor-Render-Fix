name: build

on:
  push:
    branches: [ main ]
    tags: [ '[0-9]*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set up Gradle 2.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 2.14.1

      - name: Build
        run: gradle build --no-daemon

      - name: Copy main jar
        run: |
          main_jar=$(ls build/libs/*.jar | grep -Ev 'sources|api|dev|javadoc' | head -n1)
          cp "$main_jar" build/libs/DraconicArmorRenderFix.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraconicArmorRenderFix
          path: build/libs/DraconicArmorRenderFix.jar

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/DraconicArmorRenderFix.jar
          generate_release_notes: true