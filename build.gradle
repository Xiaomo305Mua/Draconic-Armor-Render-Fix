import net.minecraftforge.gradle.delayed.DelayedString

buildscript {
    repositories {
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'
apply plugin: 'java'

version = modVersion
group = "com.xiaomo305mua"
archivesBaseName = "DraconicArmorRenderFix"

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "eclipse"
}

jar {
    manifest = project.manifest {
        from 'src/main/resources/META-INF/MANIFEST.MF'
    }
}

downloadClient {
    url = new DelayedString(project, "https://bmclapi2.bangbang93.com/version/1.7.10/client")
}

downloadServer {
    url = new DelayedString(project, "https://bmclapi2.bangbang93.com/version/1.7.10/server")
}