import net.minecraftforge.gradle.delayed.DelayedString

buildscript {
    repositories {
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'
apply plugin: 'java'

version = modVersion
group = "com.xiaomo305mua"
archivesBaseName = "DraconicArmorRenderFix"

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "eclipse"

    replaceIn "DARFMod.java"
    replace "@modId@", modId
    replace "@modName@", modName
    replace "@modVersion@", modVersion
    replace "@modDependencies@", "required-after:" + modDependencies + ";"
}

processResources {
    def p = { String k -> project.hasProperty(k) ? project.property(k) : "" }
    def mcModInfoProps = [
        'modId': p('modId'),
        'modName': p('modName'),
        'modDescription': p('modDescription'),
        'modVersion': p('modVersion'),
        'minecraftVersion': p('minecraftVersion'),
        'modUrl': p('modUrl'),
        'authorList': p('authorList'),
        'credits': p('credits'),
        'logoFile': p('logoFile')
    ]
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand mcModInfoProps
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest = project.manifest {
        attributes(
            'FMLCorePlugin': 'com.xiaomo305mua.draconicarmorrenderfix.DARFCoreMod',
            'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}

downloadClient {
    url = new DelayedString(project, "https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar")
}

downloadServer {
    url = new DelayedString(project, "https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar")
}