buildscript {
    repositories {
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'
apply plugin: 'java'

version = modVersion
group = "com.xiaomo305mua"
archivesBaseName = "DraconicArmorRenderFix"

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "eclipse"

    replaceIn "DARFMod.java"
    replace "@modId@", modId
    replace "@modName@", modName
    replace "@modVersion@", modVersion
    replace "@modDependencies@", "required-after:" + modDependencies + ";"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand project.properties
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes 'FMLCorePlugin': 'com.xiaomo305mua.draconicarmorrenderfix.DARFCoreMod'
        attributes 'FMLCorePluginContainsFMLMod': 'true'
    }
}